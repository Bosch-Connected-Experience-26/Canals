services:
  orchestrator:
    build:
      context: .
      dockerfile: Docker/Dockerfile.orchestrator
    image: canals-orchestrator
    container_name: canals-orchestrator
    ports:
      - "8001:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - MONGODB_URI=mongodb://root:root@mongodb:27017/?authSource=admin
      - MONGODB_DATABASE=canals
      - MONGODB_COLLECTION=journey_caches
      - MAPS_API_BASE_URL=http://maps-api:8000
      - USE_OLLAMA_ROUTER=${USE_OLLAMA_ROUTER:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - AWS_REGION=eu-central-1
      - AWS_BEDROCK_ENABLED=false
    depends_on:
      mongodb:
        condition: service_healthy
      maps-api:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: canals-ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: route-cache-mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=root
      - MONGODB_INITDB_ROOT_PASSWORD=root
    volumes:
      - mongodb-data:/data/db
      - mongodb-configdb:/data/configdb
      - mongodb-mongot:/data/mongot
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "root",
          "--password",
          "root",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  cache-service:
    build:
      context: .
      dockerfile: Docker/Dockerfile.cache-service
    container_name: canals-cache-service
    ports:
      - "8002:8002"
    env_file:
      - path: .env
        required: false
    environment:
      - MAPS_API_URL=http://maps-api:8000
      - MONGODB_URI=mongodb://root:root@mongodb:27017/?authSource=admin
      - MONGODB_DATABASE=route_cache
      - MONGODB_COLLECTION=pois
    depends_on:
      mongodb:
        condition: service_healthy
      maps-api:
        condition: service_started
    restart: unless-stopped

  maps-api:
    build:
      context: .
      dockerfile: Docker/Dockerfile.maps-api
    container_name: canals-maps-api
    ports:
      - "8000:8000"
    environment:
      - OCM_API_KEY=${OCM_API_KEY:-}
    restart: unless-stopped

  car-api:
    build:
      context: .
      dockerfile: Docker/Dockerfile.car-api
    container_name: canals-car-api
    ports:
      - "8003:8003"
    env_file:
      - path: .env
        required: false
    environment:
      - VEHICLE_URL=bosch-car-mock:55555
    depends_on:
      - bosch-car-mock
    restart: unless-stopped

  bosch-car-mock:
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:main
    container_name: canals-bosch-car-mock
    command: --insecure --vss /data/vss_bosch.json
    ports:
      - "55556:55555"
    volumes:
      - ./Docker/vss_bosch.json:/data/vss_bosch.json
    environment:
      - RUST_LOG=databroker::broker=debug,databroker::grpc::kuksa_val_v2=debug
    restart: unless-stopped

  e2e:
    build:
      context: .
      dockerfile: Docker/Dockerfile.e2e
    container_name: canals-e2e
    profiles:
      - test
    depends_on:
      - maps-api
      - cache-service
      - car-api
    environment:
      - MAPS_API_URL=http://maps-api:8000
      - CACHE_SERVICE_URL=http://cache-service:8002
      - CAR_API_URL=http://car-api:8003

volumes:
  mongodb-data:
  mongodb-configdb:
  mongodb-mongot:
  ollama-data:
